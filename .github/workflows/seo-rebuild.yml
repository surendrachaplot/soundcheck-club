# Daily SEO rebuild — regenerates the pre-rendered static pages against the live API
# and commits them to THIS repo (soundcheck-club → GitHub Pages). Keeps the
# date-relative pages fresh: adds the new far /<city>/<date>/ page, drops the day
# that fell off, repoints /<city>/tonight/, refreshes line-ups everywhere.
#
# The built-in GITHUB_TOKEN (contents: write) pushes THIS repo. The build scripts
# live in soundcheck-api, which is PRIVATE — GITHUB_TOKEN is scoped to the repo the
# workflow runs in and cannot read it, so that clone needs its own credential
# (API_REPO_TOKEN). This is what broke the job from 2026-07-24: the clone was
# anonymous and started failing with "could not read Username for github.com".
# Only build-seo runs (not build-club) — the app shell changes on a manual SPA deploy.
name: SEO rebuild (daily)

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: seo-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout soundcheck-club (this repo, deploy target)
        uses: actions/checkout@v4
        with:
          path: soundcheck-club

      - name: Clone soundcheck-api (private — build scripts)
        env:
          API_REPO_TOKEN: ${{ secrets.API_REPO_TOKEN }}
        run: |
          if [ -z "$API_REPO_TOKEN" ]; then
            echo "::error::API_REPO_TOKEN secret is not set. soundcheck-api is private, so this clone needs a token with read access to it. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${API_REPO_TOKEN}@github.com/surendrachaplot/soundcheck-api.git" \
            soundcheck-api

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Exact-pinned to match the local devDependency: a different esbuild version
      # would minify differently → new bundle hash → pointless daily churn.
      - name: Install esbuild (bundle minifier)
        working-directory: soundcheck-api
        run: npm install --no-save --no-audit --no-fund esbuild@0.24.0

      - name: Regenerate SEO pages (against live API)
        working-directory: soundcheck-api
        run: node build-seo.mjs

      - name: Commit & push if anything changed
        working-directory: soundcheck-club
        run: |
          git config user.name "soundcheck-bot"
          git config user.email "soundcheck-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "chore(seo): daily rebuild $(date -u +%F)"
            git push
          fi
